# .pre-commit-config.yaml
# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '\.(svg|png|jpg)$'
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.64.6
    hooks:
      - id: golangci-lint
        args: ["--fast"]

  - repo: local
    hooks:
      - id: gosec
        name: gosec
        entry: gosec
        language: system
        types: [go]
        pass_filenames: false
        args: ["-exclude-dir=cdk.out", "./..."]

      - id: go-test
        name: Go Unit Tests
        # The important part: use /bin/bash with `-c`, so we can chain multiple shell commands (export + go test).
        language: system
        entry: /bin/bash
        args:
          - -c
          - |
            # set environment variables for the test
            export MEETS_PATH="config/meets.json"
            export MEET_CREDS_PATH="config/meet_creds.json"

            # run your test
            go test -v -tags=unit ./...
        types: [go]
        pass_filenames: false

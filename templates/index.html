<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <Title>Select Referee Positions for {{ .meetName }}</Title>
  <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>

{{template "header.html" .}}

<h1>Referee Positions for: {{ .meetName }}</h1>

<div class="qr-code-container">
  <!-- left ref -->
  <div class="qr-code-item">
    <img src="/qrcode?meetName={{ .meetName }}&position=left" alt="Left Ref QR" />
    <p>Left Referee</p>
  </div>
  <!-- centre ref -->
  <div class="qr-code-item">
    <img src="/qrcode?meetName={{ .meetName }}&position=center" alt="Centre Ref QR" />
    <p>Center Referee</p>
  </div>
  <!-- right ref -->
  <div class="qr-code-item">
    <img src="/qrcode?meetName={{ .meetName }}&position=right" alt="Right Ref QR" />
    <p>Right Referee</p>
  </div>
</div>

<!-- admin panel -->
<div class="button-container">
  <a href="/lights" class="button-link">Lights</a>
  <a href="/admin?meet={{ .meetName }}" class="button-link">Meet Director Panel</a>
</div>

<!-- logo container -->
<div class="logo-container">
  <img src="{{ .Logo }}" alt="Meet Logo" style="max-height:100px;"/>
</div>

</body>
</html>
